# App icons for iOS and Android, generated from the brand kit (brand/kit). Rebuild with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  ios: true
  image_path: brand/kit/png/app-icon-1024.png
  remove_alpha_ios: true
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#14503D"
  adaptive_icon_foreground: brand/kit/png/adaptive-foreground-1024.png
  adaptive_icon_monochrome: brand/kit/png/adaptive-monochrome-1024.png
